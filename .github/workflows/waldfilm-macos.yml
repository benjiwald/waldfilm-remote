# Waldfilm Remote / Waldfilm Support: macOS builds (aarch64 + x86_64), derived from
# flutter-build.yml, job build-for-macOS. Unsigned by Apple: the app is ad-hoc signed.
# Start: gh workflow run waldfilm-macos.yml -R benjiwald/waldfilm-remote --ref waldfilm -f variants=both -f arches=both
name: Waldfilm Remote macOS

on:
  workflow_dispatch:
    inputs:
      variants:
        description: "Variants to build: both | remote | support"
        type: choice
        options: [both, remote, support]
        default: both
      arches:
        description: "Architectures: both | aarch64 | x86_64"
        type: choice
        options: [both, aarch64, x86_64]
        default: both

env:
  MAC_RUST_VERSION: "1.81"
  FLUTTER_VERSION: "3.24.5"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VERSION: "1.5.0"

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  build-macos:
    name: ${{ matrix.variant }}-${{ matrix.arch }}-apple-darwin
    needs: [generate-bridge]
    runs-on: ${{ matrix.arch == 'aarch64' && 'macos-14' || 'macos-15-intel' }}
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(inputs.variants == 'remote' && '["remote"]' || inputs.variants == 'support' && '["support"]' || '["remote","support"]') }}
        arch: ${{ fromJSON(inputs.arches == 'aarch64' && '["aarch64"]' || inputs.arches == 'x86_64' && '["x86_64"]' || '["aarch64","x86_64"]') }}
    env:
      APP_NAME: ${{ matrix.variant == 'support' && 'WaldfilmSupport' || 'WaldfilmRemote' }}
      DISPLAY_NAME: ${{ matrix.variant == 'support' && 'Waldfilm Support' || 'Waldfilm Remote' }}
      OUT_NAME: ${{ matrix.variant == 'support' && 'waldfilm-support' || 'waldfilm-remote' }}
      TARGET: ${{ matrix.arch }}-apple-darwin
      VCPKG_TRIPLET: ${{ matrix.arch == 'aarch64' && 'arm64-osx' || 'x64-osx' }}
      EXTRA_BUILD_ARGS: ${{ matrix.arch == 'aarch64' && '--screencapturekit' || '' }}
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Apply Waldfilm Support variant
        if: ${{ matrix.variant == 'support' }}
        shell: bash
        run: bash .github/scripts/waldfilm-apply-support.sh

      - name: Install build runtime
        run: |
          brew install llvm create-dmg
          if command -v pkg-config &>/dev/null; then
              echo "pkg-config is already installed"
          else
              brew install pkg-config
          fi

      - name: Install NASM
        run: |
          wget https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/macosx/nasm-2.16.03-macosx.zip
          unzip nasm-2.16.03-macosx.zip
          sudo cp nasm-2.16.03/nasm /usr/local/bin/nasm
          nasm --version

      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Patch flutter
        run: |
          cd $(dirname $(dirname $(which flutter)))
          if [[ "3.24.5" == ${{env.FLUTTER_VERSION}} ]]; then
            git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff
          fi

      - name: Workaround for flutter issue
        shell: bash
        run: |
          cd "$(dirname "$(which flutter)")"
          sed -i -e 's/_setFramesEnabledState(false);/\/\/_setFramesEnabledState(false);/g' ../packages/flutter/lib/src/scheduler/binding.dart
          grep -n '_setFramesEnabledState(false);' ../packages/flutter/lib/src/scheduler/binding.dart

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.MAC_RUST_VERSION }}
          targets: ${{ env.TARGET }}
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: macos-${{ matrix.arch }}-${{ matrix.variant }}

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        run: |
          if ! $VCPKG_ROOT/vcpkg \
            install \
            --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done
            exit 1
          fi

      - name: Build rustdesk
        run: |
          if [ "${{ env.TARGET }}" = "aarch64-apple-darwin" ]; then
            MIN_MACOS_VERSION="12.3"
            sed -i -e "s/MACOSX_DEPLOYMENT_TARGET\=[0-9]*.[0-9]*/MACOSX_DEPLOYMENT_TARGET=${MIN_MACOS_VERSION}/" build.py
            sed -i -e "s/platform :osx, '.*'/platform :osx, '${MIN_MACOS_VERSION}'/" flutter/macos/Podfile
            sed -i -e "s/osx_minimum_system_version = \"[0-9]*.[0-9]*\"/osx_minimum_system_version = \"${MIN_MACOS_VERSION}\"/" Cargo.toml
            sed -i -e "s/MACOSX_DEPLOYMENT_TARGET = [0-9]*.[0-9]*;/MACOSX_DEPLOYMENT_TARGET = ${MIN_MACOS_VERSION};/" flutter/macos/Runner.xcodeproj/project.pbxproj
          fi
          ./build.py --flutter --hwcodec --unix-file-copy-paste ${{ env.EXTRA_BUILD_ARGS }}

      - name: Ad-hoc sign app bundle
        run: |
          APP="./flutter/build/macos/Build/Products/Release/${APP_NAME}.app"
          ls -la "$APP/Contents/MacOS"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" -c "Print :CFBundleName" -c "Print :CFBundleDisplayName" -c "Print :CFBundleExecutable" "$APP/Contents/Info.plist"
          # No Apple Developer ID available: ad-hoc signature (no hardened runtime, so the
          # ad-hoc signed librustdesk.dylib/frameworks load without team-ID library validation).
          codesign --force --deep --sign - --entitlements ./flutter/macos/Runner/Release.entitlements "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Create dmg
        run: |
          CREATE_DMG="$(command -v create-dmg)"
          CREATE_DMG="$(readlink -f "$CREATE_DMG")"
          sed -i -e 's/MAXIMUM_UNMOUNTING_ATTEMPTS=3/MAXIMUM_UNMOUNTING_ATTEMPTS=7/' "$CREATE_DMG"
          mkdir -p SignOutput
          DMG="SignOutput/${OUT_NAME}-${VERSION}-${{ matrix.arch }}.dmg"
          create-dmg --volname "${DISPLAY_NAME}" --icon "${APP_NAME}.app" 200 190 --hide-extension "${APP_NAME}.app" \
            --window-size 800 400 --app-drop-link 600 185 "$DMG" "./flutter/build/macos/Build/Products/Release/${APP_NAME}.app"
          cd SignOutput && shasum -a 256 *.dmg | tee SHA256SUMS-${{ matrix.arch }}.txt

      - name: Upload dmg
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.OUT_NAME }}-${{ env.VERSION }}-macos-${{ matrix.arch }}
          path: ./SignOutput
